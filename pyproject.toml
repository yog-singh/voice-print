[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceprint"
version = "0.1.0"
authors = [
    { name="Yogesh", email="yogesh.singh.ams5@gmail.com" },
]
description = "Speaker recognition, verification and diarization on top of WeSpeaker ResNet34"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.22",
    "onnxruntime>=1.15",
    "soundfile>=0.12",
    "soxr>=0.3",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=7", "torch", "torchaudio"]

[project.scripts]
voiceprint = "voiceprint.cli:main"

[tool.setuptools.packages.find]
include = ["voiceprint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
